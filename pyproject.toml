[project]
name = "pulseguard-z"
version = "0.1.0"
description = "PulseGuard-Z: Real-Time G2P Flash Fraud Detection on IBM LinuxONE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "backend.main:app"
